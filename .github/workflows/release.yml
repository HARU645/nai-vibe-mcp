# v로 시작하는 태그를 올리면: 테스트 → .mcpb 빌드 → Release 만들고 파일 첨부
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: 태그와 package.json 버전이 같은지
        run: |
          v="${GITHUB_REF_NAME#v}"
          p="$(node -p "require('./package.json').version")"
          if [ "$v" != "$p" ]; then echo "태그 $v 와 package.json $p 가 달라"; exit 1; fi
      - run: npm run pack:mcpb
      - run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/nai-vibe-mcp-*.mcpb \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
